<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Gravity Warp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #020208; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .instructions { position: absolute; bottom: 20px; color: rgba(255,255,255,0.4); font-size: 12px; pointer-events: none; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body>

    <canvas id="cosmicCanvas"></canvas>
    <div class="instructions">Screen par touch karke shockwave banayein</div>

    <script>
        const canvas = document.getElementById('cosmicCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let centerX = canvas.width / 2;
        let centerY = canvas.height / 2;
        let globalHue = 0;
        let shockwaves = [];

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            centerX = canvas.width / 2;
            centerY = canvas.height / 2;
        });

        class CosmicParticle {
            constructor() {
                this.reset();
                // Kuch particles ko shuru se hi center ke paas rakhna taaki blend acha ho
                this.orbitRadius = Math.random() * (Math.min(canvas.width, canvas.height) * 0.6);
            }

            reset() {
                // Center se door orbit start karna
                this.orbitRadius = Math.random() * (Math.min(canvas.width, canvas.height) * 0.5) + 50;
                this.angle = Math.random() * Math.PI * 2;
                // Ghumne ki speed (paas wale tez ghumenge, door wale dheere)
                this.angularVelocity = (Math.random() * 0.02 + 0.005) * (100 / this.orbitRadius);
                // Andar khinchne ki speed (Gravity pull)
                this.radialVelocity = Math.random() * 0.5 + 0.2;
                this.size = Math.random() * 1.5 + 0.5;
                // Har particle ka custom rainbow tone
                this.hueOffset = Math.random() * 60; 
            }

            update() {
                // 1. Angle badhana (Gol ghumna)
                this.angle += this.angularVelocity;

                // 2. Gravity Pull (Center ki taraf khinche chale aana)
                this.orbitRadius -= this.radialVelocity;

                // Agar shockwave aati hai to particle baahar pheka jayega
                shockwaves.forEach(wave => {
                    let dx = this.x - wave.x;
                    let dy = this.y - wave.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < wave.currentRadius && dist > wave.currentRadius - 30) {
                        this.orbitRadius += wave.force; // Blast effect!
                    }
                });

                // 3. X aur Y coordinate calculate karna
                this.x = centerX + Math.cos(this.angle) * this.orbitRadius;
                this.y = centerY + Math.sin(this.angle) * this.orbitRadius;

                // Agar particle black hole ke bilkul andar chala jaye to reset karein
                if (this.orbitRadius < 10) {
                    this.reset();
                }
            }

            draw() {
                let currentHue = (globalHue + this.hueOffset) % 360;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                // Futuristic Cyan/Purple glow look
                ctx.fillStyle = `hsl(${currentHue}, 100%, 70%)`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = `hsl(${currentHue}, 100%, 50%)`;
                ctx.fill();
            }
        }

        // Click ya Touch par Shockwave generate karne ka class
        class Shockwave {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.currentRadius = 0;
                this.maxRadius = 200;
                this.speed = 4;
                this.force = 40; // Particles ko kitna door phekna hai
                this.alpha = 1;
            }
            update() {
                this.currentRadius += this.speed;
                this.alpha -= 0.02;
                this.force *= 0.9; // Waqt ke sath force kam hona
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // 800 dense particles create karna
        const particles = [];
        const particleCount = 800;
        for (let i = 0; i < particleCount; i++) {
            particles.push(new CosmicParticle());
        }

        // Touch/Click Interaction handler
        function handleInteraction(e) {
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            if (clientX && clientY) {
                shockwaves.push(new Shockwave(clientX, clientY));
            }
        }

        window.addEventListener('mousedown', handleInteraction);
        window.addEventListener('touchstart', handleInteraction);

        function animate() {
            // Space-time delay effect ke liye trail background
            ctx.fillStyle = 'rgba(2, 2, 8, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Shifting global color scheme
            globalHue = (globalHue + 0.5) % 360;

            // Black Hole Center Point design
            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#000';
            ctx.shadowBlur = 30;
            ctx.shadowColor = `hsl(${globalHue}, 100%, 50%)`;
            ctx.fill();

            // Particles update aur draw karna
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Shockwaves manage karna
            shockwaves.forEach((wave, index) => {
                wave.update();
                wave.draw();
                if (wave.alpha <= 0) {
                    shockwaves.splice(index, 1);
                }
            });

            ctx.shadowBlur = 0; // Performance tuning
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
