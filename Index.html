<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cartoon Ball Dodger</title>
    <style>
        body { 
            margin: 0; 
            background: #050510; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: sans-serif; 
            color: #fff; 
            overflow: hidden; 
            touch-action: none;
        }
        #gameContainer { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: #070716; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            display: block; 
        }
        .ui { 
            position: absolute; 
            top: 25px; 
            left: 20px; 
            right: 20px; 
            display: flex; 
            justify-content: space-between; 
            font-size: 18px; 
            font-weight: bold; 
            text-shadow: 0 0 8px #00f0ff; 
            font-family: monospace; 
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui">
            <div id="levelDisplay">LEVEL: 1</div>
            <div id="scoreDisplay">SCORE: 0</div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            const container = document.getElementById("gameContainer");
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            player.y = canvas.height - 80; // Cartoon banda zameen se thoda upar rahega
        }
        
        // Player (Cartoon Banda) properties
        let player = { 
            x: window.innerWidth / 2, 
            y: window.innerHeight - 80, 
            width: 24, 
            height: 45 
        };
        
        let fallingBalls = [];
        let score = 0;
        let level = 1;
        let gameOver = false;

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Smooth Touch for Mobile (Ungli se bande ko drag karein)
        canvas.addEventListener("touchmove", (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            let targetX = (touch.clientX - rect.left) * (canvas.width / rect.width);
            
            // Banda screen ke andar rahe
            if (targetX < player.width) targetX = player.width;
            if (targetX > canvas.width - player.width) targetX = canvas.width - player.width;
            player.x = targetX;
        }, { passive: false });

        // Aasman se girti hui Balls create karne ka function
        function spawnBall() {
            let size = Math.random() * 12 + 8; // Random ball size (8px se 20px)
            let speed = Math.random() * 4 + 4 + (level * 0.8); // Level ke mutabiq speed badhegi
            
            fallingBalls.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -20,
                radius: size,
                speed: speed,
                color: 'hsl(' + (Math.random() * 360) + ', 100%, 65%)' // Har ball ka random neon rang
            });
        }

        // Simple Circle-to-Rectangle Collision Check
        function checkCollision(circle, rect) {
            let distX = Math.abs(circle.x - rect.x);
            let distY = Math.abs(circle.y - (rect.y - rect.height/2));

            if (distX > (rect.width/2 + circle.radius)) { return false; }
            if (distY > (rect.height/2 + circle.radius)) { return false; }

            if (distX <= (rect.width/2)) { return true; } 
            if (distY <= (rect.height/2)) { return true; }

            let dx = distX - rect.width/2;
            let dy = distY - rect.height/2;
            return (dx*dx + dy*dy <= (circle.radius*circle.radius));
        }

        function update() {
            if (gameOver) return;

            // Nayi ball giranay ka gap (Level badhne par zyada balls girenge)
            let spawnRate = Math.max(10, 30 - (level * 2));
            if (Math.random() * 100 < 4) {
                if (fallingBalls.length < (5 + level * 2)) {
                    spawnBall();
                }
            }

            for (let i = fallingBalls.length - 1; i >= 0; i--) {
                let ball = fallingBalls[i];
                ball.y += ball.speed; // Ball ko niche le jana

                // Collision check (Kiya ball bande ko lagi?)
                if (checkCollision(ball, player)) {
                    gameOver = true;
                }

                // Agar ball zameen se nikal gayi toh score milega
                if (ball.y > canvas.height + 20) {
                    fallingBalls.splice(i, 1);
                    score += 10;
                    if (score % 100 === 0) level++;
                }
            }

            document.getElementById("scoreDisplay").innerText = "SCORE: " + score;
            document.getElementById("levelDisplay").innerText = "LEVEL: " + level;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zameen/Floor line
            ctx.strokeStyle = "#121238";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, player.y + 10);
            ctx.lineTo(canvas.width, player.y + 10);
            ctx.stroke();

            // --- CARTOON BANDA DRAWING (Stickman) ---
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00f0ff";
            ctx.strokeStyle = "#ffffff";
            ctx.fillStyle = "#ffffff";
            ctx.lineWidth = 3;

            let px = player.x;
            let py = player.y;

            // 1. Face / Sir (Glow Circle)
            ctx.beginPath();
            ctx.arc(px, py - 35, 7, 0, Math.PI * 2);
            ctx.fill();

            // 2. Body / Torso
            ctx.beginPath();
            ctx.moveTo(px, py - 28);
            ctx.lineTo(px, py - 10);
            ctx.stroke();

            // 3. Hands / Haath
            ctx.beginPath();
            ctx.moveTo(px - 12, py - 22);
            ctx.lineTo(px + 12, py - 22);
            ctx.stroke();

            // 4. Legs / Paon
            ctx.beginPath();
            ctx.moveTo(px, py - 10);
            ctx.lineTo(px - 10, py + 8);
            ctx.moveTo(px, py - 10);
            ctx.lineTo(px + 10, py + 8);
            ctx.stroke();


            // --- FALLING BALLS DRAWING ---
            fallingBalls.forEach(ball => {
                ctx.shadowBlur = 15;
                ctx.shadowColor = ball.color;
                ctx.fillStyle = ball.color;
                
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Ball ke andar chota white core takay real lage
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(ball.x - ball.radius*0.2, ball.y - ball.radius*0.2, ball.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.shadowBlur = 0; // Reset glow

            if (gameOver) {
                ctx.fillStyle = "rgba(4, 4, 15, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 28px monospace";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = "#ffffff";
                ctx.font = "15px monospace";
                ctx.fillText("Screen Par Tap Karein Restart Ke Liye", canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        canvas.addEventListener("click", () => {
            if (gameOver) {
                gameOver = false;
                score = 0;
                level = 1;
                fallingBalls = [];
                player.x = canvas.width / 2;
            }
        });

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
