<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AICODEHAX - Rabi ul Awal Special</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* 🌌 Deep Cloudy Night Galaxy Background */
            background: radial-gradient(circle at 50% 30%, #032b10 0%, #02111a 45%, #000408 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }
        /* 💡 Shadi Wali Mirchi Lights Rows */
        .mirchi-lights-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
            z-index: 4;
        }
        .light-string {
            width: 3px; 
            height: 80px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8) 20%, #ffffff 100%);
            animation: mirchiBlink 1s infinite alternate;
        }
        .light-string::after {
            content: "";
            width: 14px; 
            height: 22px;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            bottom: -20px;
        }
        .string-1 { color: #ff0055; box-shadow: 0 0 15px #ff0055, inset 0 0 4px #ff0055; animation-delay: 0.1s; }
        .string-1::after { background: #ff0055; }
        .string-2 { color: #00ffcc; box-shadow: 0 0 15px #00ffcc, inset 0 0 4px #00ffcc; animation-delay: 0.4s; }
        .string-2::after { background: #00ffcc; }
        .string-3 { color: #ffd700; box-shadow: 0 0 15px #ffd700, inset 0 0 4px #ffd700; animation-delay: 0.2s; }
        .string-3::after { background: #ffd700; }
        .string-4 { color: #ff00ff; box-shadow: 0 0 15px #ff00ff, inset 0 0 4px #ff00ff; animation-delay: 0.6s; }
        .string-4::after { background: #ff00ff; }
        .string-5 { color: #33ff30; box-shadow: 0 0 15px #33ff30, inset 0 0 4px #33ff30; animation-delay: 0.3s; }
        .string-5::after { background: #33ff30; }
        .string-6 { color: #00bfff; box-shadow: 0 0 15px #00bfff, inset 0 0 4px #00bfff; animation-delay: 0.5s; }
        .string-6::after { background: #00bfff; }
        
        /* ⭐ Dense Galaxy Stars Layer */
        .stars-container {
            position: absolute;
            width: 100%;
            height: 65vh;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 12px rgba(255,255,255,0.9);
            animation: starTwinkle 2s infinite ease-in-out alternate;
        }
        /* 🎆 Fireworks Interactive Canvas */
        #fireworksCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 3;
        }
        /* 🕌 Mosque Structure Container */
        .mosque-wrapper {
            position: absolute;
            bottom: 30px; 
            width: 100%;
            height: 38vh;
            z-index: 2;
            pointer-events: none;
        }
        .mosque-base {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 16vh;
            background: #011401;
            border-top: 3px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }
        /* Main Onion Dome Center */
        .main-dome {
            position: absolute;
            bottom: 15.5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 110px;
            background: #011401;
            border: 3px solid #00ffcc;
            border-bottom: none;
            border-radius: 50% 50% 0 0 / 65% 65% 0 0;
            box-shadow: 0 -5px 15px rgba(0, 255, 204, 0.4);
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .main-dome::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 20px;
            background: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
        }
        /* Chand Main Dome ke Dande ke upar fixed */
        .dome-moon {
            position: absolute;
            top: -34px;
            left: 52%;
            transform: translateX(-50%) rotate(-30deg);
            width: 14px;
            height: 14px;
            background: transparent;
            border-radius: 50%;
            box-shadow: 3px 3px 0 0 #00ffcc;
            filter: drop-shadow(0 0 5px #00ffcc);
        }
        /* Darwaza inside Gumbad */
        .mosque-door {
            position: relative;
            bottom: 0;
            width: 50px;
            height: 65px; 
            border: 2.5px solid #00ffcc;
            border-bottom: none;
            border-radius: 25px 25px 0 0;
            background: radial-gradient(circle at bottom, #012b10 0%, #011401 100%);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6), inset 0 0 10px rgba(0, 255, 204, 0.4);
            z-index: 3;
        }
        /* Slim Intricate Towers / Minarets */
        .cyber-minaret {
            position: absolute;
            bottom: 0;
            width: 22px;
            height: 35vh;
            background: #011401;
            border: 3px solid #00ffcc;
            border-bottom: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        .minaret-left-side { left: 8%; }
        .minaret-right-side { right: 8%; }
        .cyber-minaret::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 20px;
            background: #00ffcc;
            box-shadow: 0 0 6px #00ffcc;
        }
        .minaret-head {
            position: absolute;
            top: 0;
            left: -3px;
            width: 22px;
            height: 24px;
            background: #011401;
            border: 3px solid #00ffcc;
            border-bottom: none;
            border-radius: 50% 50% 0 0 / 70% 70% 0 0;
        }
        .minaret-moon {
            position: absolute;
            top: -34px;
            left: 5px;
            transform: rotate(-30deg);
            width: 10px;
            height: 10px;
            background: transparent;
            border-radius: 50%;
            box-shadow: 2px 2px 0 0 #00ffcc;
            filter: drop-shadow(0 0 4px #00ffcc);
        }
        /* Big Sky Moon Graphic */
        .crescent-moon {
            position: absolute;
            top: 15%;
            right: 12%;
            width: 65px;
            height: 65px;
            background: transparent;
            border-radius: 50%;
            box-shadow: 14px 14px 0 0 #ffd700;
            z-index: 1;
            transform: rotate(-15deg);
            filter: drop-shadow(0 0 15px #ffd700);
        }
        /* Content Container */
        .container {
            text-align: center;
            z-index: 2;
            padding: 20px;
            margin-bottom: 12vh;
            pointer-events: none;
        }
        /* 💥 FIXED: Pure High-Tech Liquid Transparent Neon Outline Styles */
        .word {
            display: inline-block;
            font-size: 2.1rem;
            font-weight: 900;
            font-family: Arial, Helvetica, sans-serif;
            text-transform: uppercase;
            letter-spacing: 5px;
            line-height: 1.6;
            margin: 5px 8px;
            color: transparent; /* Solid white center core completely removed */
            transition: all 0.5s ease-in-out;
        }
        .block-line { display: block; }
        .sub-text {
            font-size: 0.85rem;
            color: #ffd700;
            margin-top: 25px;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 8px #ffd700, 0 0 20px #ff8c00;
        }
        @keyframes mirchiBlink {
            0% { opacity: 0.2; filter: brightness(0.4) drop-shadow(0 0 0px transparent); }
            100% { opacity: 1; filter: brightness(2) drop-shadow(0 0 25px currentColor) drop-shadow(0 0 50px currentColor); }
        }
        @keyframes starTwinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <!-- Canvas and Layers -->
    <div class="stars-container" id="starsContainer"></div>
    <canvas id="fireworksCanvas"></canvas>

    <!-- Mirchi Lights Rows -->
    <div class="mirchi-lights-container">
        <div class="light-string string-1" style="height: 60px;"></div>
        <div class="light-string string-2" style="height: 90px;"></div>
        <div class="light-string string-3" style="height: 70px;"></div>
        <div class="light-string string-4" style="height: 100px;"></div>
        <div class="light-string string-5" style="height: 65px;"></div>
        <div class="light-string string-6" style="height: 85px;"></div>
        <div class="light-string string-2" style="height: 60px;"></div>
        <div class="light-string string-1" style="height: 95px;"></div>
    </div>

    <div class="crescent-moon"></div>

    <!-- Mosque Outer Wrapper -->
    <div class="mosque-wrapper">
        <div class="main-dome">
            <div class="dome-moon"></div>
            <div class="mosque-door"></div>
        </div>
        <div class="cyber-minaret minaret-left-side">
            <div class="minaret-head"></div>
            <div class="minaret-moon"></div>
        </div>
        <div class="cyber-minaret minaret-right-side">
            <div class="minaret-head"></div>
            <div class="minaret-moon"></div>
        </div>
        <div class="mosque-base"></div> 
    </div>

    <div class="container">
        <div class="block-line">
            <span class="word" id="word1">12</span>
            <span class="word" id="word2">Rabi-ul-Awal</span>
        </div>
        <div class="block-line">
            <span class="word" id="word3">Mubarak</span>
        </div>
        <div class="sub-text">AICODEHAX SPECIAL</div>
    </div>

    <script>
        // 1. Stars Generator 
        const starsContainer = document.getElementById('starsContainer');
        const starCount = 80;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.top = (Math.random() * 80) + '%';
            star.style.left = (Math.random() * 100) + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            const size = Math.random() * 2.5 + 1.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            starsContainer.appendChild(star);
        }

        // 2. 🌈 FIXED: True Multi-Layer Transparent Neon Glass Color Rotation Script
        const wordElements = [document.getElementById('word1'), document.getElementById('word2'), document.getElementById('word3')];
        const neonColors = [
            { border: '#00ffcc', glow: '#00ff33' }, // Cyber Green
            { border: '#ffd700', glow: '#ff8c00' }, // Laser Gold
            { border: '#00bfff', glow: '#0044ff' }, // Electric Blue
            { border: '#ff007f', glow: '#ff0000' }, // Ruby Red
            { border: '#e0b0ff', glow: '#9400d3' }  // Digital Purple
        ];
        
        function changeWordsColorLive() {
            wordElements.forEach((element) => {
                const randomIndex = Math.floor(Math.random() * neonColors.length);
                const color = neonColors[randomIndex];
                
                // 🟢 NEW: Direct text stroke and colorful neon reflection (No white solid center blocking)
                element.style.webkitTextStroke = `2px ${color.border}`;
                element.style.textShadow = `0 0 10px ${color.border}, 0 0 25px ${color.border}, 0 0 50px ${color.glow}, 0 0 80px ${color.glow}`;
            });
        }
        changeWordsColorLive();
        setInterval(changeWordsColorLive, 1400);

        // 3. High-Glow Interactive Fireworks System
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        const fireworkColors = ['#ff0055', '#00ffcc', '#ffd700', '#ff00ff', '#33ff30', '#00bfff'];

        class Particle {
            constructor(x, y, color, isHuge = false) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = isHuge ? (Math.random() * 7 + 3) : (Math.random() * 3.5 + 1);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = isHuge ? (Math.random() * 0.012 + 0.008) : (Math.random() * 0.018 + 0.012);
                this.size = isHuge ? (Math.random() * 2.5 + 2.5) : 2.5; 
                this.history = [];
                this.maxHistory = 5; 
            }
            draw() {
                if (this.history.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.history.x, this.history.y);
                    for (let i = 1; i < this.history.length; i++) {
                        ctx.lineTo(this.history[i].x, this.history[i].y);
                    }
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size * 0.5;
                    ctx.globalAlpha = this.alpha * 0.3;
                    ctx.stroke();
                }

                ctx.save(); 
                ctx.globalAlpha = this.alpha; 
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fillStyle = '#ffffff'; 
                ctx.shadowBlur = 18; 
                ctx.shadowColor = this.color; 
                ctx.fill(); 
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.8, 0, Math.PI * 2); 
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() { 
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > this.maxHistory) this.history.shift();
                this.x += this.vx; 
                this.y += this.vy; 
                this.vy += 0.045; 
                this.alpha -= this.decay; 
            }
        }

        function spawnTouchFirework(x, y) {
            for (let i = 0; i < 70; i++) {
                const color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
                particles.push(new Particle(x, y, color, true));
            }
        }

        function spawnAutoFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.5) + (canvas.height * 0.15);
            const color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
            for (let i = 0; i < 22; i++) { particles.push(new Particle(x, y, color, false)); }
        }

        canvas.addEventListener('mousedown', (e) => { spawnTouchFirework(e.clientX, e.clientY); });
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches;
            spawnTouchFirework(touch.clientX, touch.clientY);
        });

        function animateFireworks() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, index) => {
                p.update(); p.draw();
                if (p.alpha <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(animateFireworks);
        }

        setInterval(spawnAutoFirework, 1400);
        animateFireworks();
    </script>
</body>
</html>
